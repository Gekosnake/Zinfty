<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="google-site-verification" content="f0FCzlXebnMKCm73YdsJf9jZqWgwuzkc_ID5RpS9hvs" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Zinfty" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./logo.png" />
  <title>Zinfty Hub — All Your Universe in One Place</title>
  <link id="dynamicFavicon" rel="icon" type="image/png" href="./logo.png" />
  <style>
    :root {
      --bg-page: #f8fbff;
      --bg-card: #ffffff;
      --sky-primary: #0ea5e9;
      --sky-dark: #0284c7;
      --sky-light: #e0f2fe;
      --sky-soft: #f0f9ff;
      --border-color: #bae6fd;
      --border-subtle: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #e0f2fe 0%, #f8fbff 28%, #ffffff 100%);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* IP 차단 오버레이 화면 */
    #blockedScreen {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .blocked-box {
      max-width: 460px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 40px 32px;
      backdrop-filter: blur(12px);
    }

    .blocked-box h1 {
      font-size: 1.6rem;
      margin: 14px 0 10px;
      color: #f87171;
    }

    .blocked-box p {
      color: #cbd5e1;
      font-size: 0.94rem;
      margin-bottom: 18px;
    }

    .blocked-meta {
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 16px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 0.84rem;
      color: #94a3b8;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .notice-bar {
      background: linear-gradient(90deg, #0284c7, #0ea5e9);
      color: #ffffff;
      font-size: 0.84rem;
      font-weight: 600;
      padding: 9px 16px;
      text-align: center;
      display: none;
    }

    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-inner {
      height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .header-square-logo {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      object-fit: cover;
      border: 1px solid var(--border-color);
      background: #ffffff;
      display: block;
    }

    .hub-tag {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 8px;
      background: var(--sky-soft);
      color: var(--sky-dark);
      border: 1px solid var(--border-color);
      letter-spacing: 0.04em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 999px;
      background: #ffffff;
      color: var(--text-sub);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
    }

    .install-app-btn {
      font-size: 0.82rem;
      padding: 6px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      border: none;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.28);
      transition: transform 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .install-app-btn:hover {
      transform: translateY(-1px);
    }

    @media (max-width: 540px) {
      .stat-pill { display: none; }
    }

    .hero {
      text-align: center;
      padding: 48px 0 36px;
    }

    .hero-logo-wrap {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      border-radius: 26px;
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      box-shadow: 0 12px 28px rgba(14, 165, 233, 0.14);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero h1 {
      font-size: clamp(2.0rem, 4.8vw, 3.0rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    .hero h1 span { color: var(--sky-primary); }

    .hero p {
      color: var(--text-sub);
      font-size: 1.05rem;
      max-width: 540px;
      margin: 0 auto 28px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .search-wrap {
      width: 100%;
      max-width: 520px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 14px 44px;
      border-radius: 14px;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 4px 14px rgba(14, 165, 233, 0.06);
      transition: all 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--sky-primary);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    .search-wrap .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--sky-primary);
    }

    .clear-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: #e2e8f0;
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
      display: none;
      color: #475569;
    }

    .toolbar {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .cat-btn {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-btn:hover {
      background: var(--sky-soft);
      color: var(--sky-dark);
    }

    .cat-btn.active {
      background: var(--sky-primary);
      border-color: var(--sky-primary);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(14, 165, 233, 0.25);
    }

    .view-options {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-sub);
      font-size: 0.84rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
      padding-bottom: 80px;
    }

    .grid.list-mode { grid-template-columns: 1fr; }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
      transition: all 0.22s ease;
      position: relative;
    }

    .card:not(.soon):hover {
      transform: translateY(-4px);
      border-color: var(--sky-primary);
      box-shadow: 0 12px 28px rgba(14, 165, 233, 0.14);
    }

    .card.soon {
      opacity: 0.72;
      background: #f8fafc;
      cursor: default;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .card-icon {
      width: 56px;
      height: 56px;
      aspect-ratio: 1 / 1;
      border-radius: 15px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      overflow: hidden;
      flex-shrink: 0;
      padding: 0;
    }

    .card-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .fav-btn {
      background: #f8fafc;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.15s;
    }

    .fav-btn.active {
      background: #fef9c3;
      border-color: #fde047;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 0.03em;
    }

    .badge-live { background: #dcfce7; color: #15803d; }
    .badge-beta { background: #e0f2fe; color: #0369a1; }
    .badge-soon { background: #f1f5f9; color: #64748b; }

    .card-title {
      font-size: 1.18rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    .card-footer {
      padding-top: 14px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--sky-dark);
      font-family: monospace;
      font-weight: 600;
    }

    .click-stat {
      font-family: -apple-system, sans-serif;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 500;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: #ffffff;
      border-radius: 18px;
      border: 1px dashed var(--border-color);
    }

    footer {
      border-top: 1px solid var(--border-color);
      background: #ffffff;
      padding: 28px 0;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- IP 차단 감지 시 즉시 덮어쓰는 화면 -->
  <div id="blockedScreen">
    <div class="blocked-box">
      <div style="font-size:3rem;">🚫</div>

  </div>

  <div id="appRoot">

    <header>

        <a href="./index.html" class="logo">

        <div class="controls">

        <div class="view-options">

      <section class="grid" id="serviceGrid">

      </section>
    </main>

    <footer>
      <div class="container">© 2026 Zinfty. All services connected via *.zinfty.com</div>
    </footer>
  </div>

  <script type="module">
    // =========================================================
    // 1. PWA 서비스 워커 등록 및 앱 설치 버튼 제어
    // =========================================================
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById("installAppBtn");

    // 이미 앱 모드(standalone)로 실행 중이면 설치 버튼 숨김
    if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true) {
      if (installBtn) installBtn.style.display = "none";
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = "inline-flex";
    });

    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      if (installBtn) installBtn.style.display = "none";
    });

    if (installBtn) {
      installBtn.addEventListener("click", async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          deferredPrompt = null;
        } else {
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          if (isIOS) {
            alert("아이폰/아이패드 앱 설치 방법:\n하단 사파리 메뉴의 [공유(□↑)] 버튼을 누른 뒤\n[홈 화면에 추가]를 선택하시면 바탕화면에 앱으로 설치됩니다!");
          } else {
            alert("브라우저 우측 상단 메뉴(⋮)에서 [앱 설치] 또는 [홈 화면에 추가]를 누르시면 스마트폰/PC에 Zinfty 앱이 설치됩니다!");
          }
        }
      });
    }

    // =========================================================
    // 2. 브라우저 탭 파비콘 1:1 정사각형 자동 크롭
    // =========================================================
    (function fixSquareFavicon() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => {
        const size = 64;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        const minSide = Math.min(img.width, img.height);
        const sx = (img.width - minSide) / 2;
        const sy = (img.height - minSide) / 2;

        ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

        const link = document.getElementById("dynamicFavicon");
        if (link) link.href = canvas.toDataURL("image/png");
      };
      img.src = "./logo.png";
    })();

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import {
      getFirestore, collection, doc, addDoc, updateDoc, onSnapshot,
      serverTimestamp, increment, arrayUnion
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACPThFj93lZ__x6OjIsNQaifL9LAEleGw",
      authDomain: "zinfty.firebaseapp.com",
      projectId: "zinfty",
      storageBucket: "zinfty.firebasestorage.app",
      messagingSenderId: "858644844927",
      appId: "1:858644844927:web:43427e13c7c01a8f288a4a",
      measurementId: "G-04QXTF2YYQ"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);

    let currentVisitorDocId = null;
    let isIpBlocked = false;
    const pageEnterTime = Date.now();

    function getGPUInfo() {
      try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return { vendor: "unknown", renderer: "unknown" };
        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        if (!debugInfo) return { vendor: "masked", renderer: "masked" };
        return {
          vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || "unknown",
          renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || "unknown"
        };
      } catch (e) {
        return { vendor: "error", renderer: "error" };
      }
    }

    function parseUserAgent(ua) {
      let browser = "Unknown Browser";
      if (ua.includes("Edg/")) browser = "Microsoft Edge";
      else if (ua.includes("Whale/")) browser = "Naver Whale";
      else if (ua.includes("SamsungBrowser/")) browser = "Samsung Internet";
      else if (ua.includes("OPR/") || ua.includes("Opera")) browser = "Opera";
      else if (ua.includes("Chrome/") && !ua.includes("Edg/")) browser = "Google Chrome";
      else if (ua.includes("Safari/") && !ua.includes("Chrome/")) browser = "Apple Safari";
      else if (ua.includes("Firefox/")) browser = "Mozilla Firefox";

      let os = "Unknown OS";
      if (ua.includes("Windows NT 10.0")) os = "Windows 10/11";
      else if (ua.includes("Windows")) os = "Windows";
      else if (ua.includes("iPhone")) os = "iOS (iPhone)";
      else if (ua.includes("iPad")) os = "iPadOS";
      else if (ua.includes("Android")) os = "Android";
      else if (ua.includes("Mac OS X")) os = "macOS";
      else if (ua.includes("Linux")) os = "Linux";

      const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);
      const isTablet = /iPad|Tablet/i.test(ua);
      const deviceType = isTablet ? "Tablet" : (isMobile ? "Mobile" : "Desktop");

      return { browser, os, deviceType };
    }

    async function getNetworkAndIPInfo() {
      let ipData = {
        ip: "수집 불가",
        country: "-",
        countryCode: "-",
        region: "-",
        city: "-",
        isp: "-",
        org: "-",
        asn: "-",
        timezone: "-"
      };

      try {
        const res = await fetch("https://ipwho.is/");
        const json = await res.json();
        if (json && json.success) {
          ipData = {
            ip: json.ip || "unknown",
            country: json.country || "-",
            countryCode: json.country_code || "-",
            region: json.region || "-",
            city: json.city || "-",
            isp: json.connection?.isp || "-",
            org: json.connection?.org || "-",
            asn: json.connection?.asn ? `AS${json.connection.asn}` : "-",
            timezone: json.timezone?.id || "-"
          };
          return ipData;
        }
      } catch (e) {}

      try {
        const res2 = await fetch("https://api.ipify.org?format=json");
        const json2 = await res2.json();
        if (json2?.ip) ipData.ip = json2.ip;
      } catch (e) {}

      return ipData;
    }

    function ipToDocId(ip) {
      return String(ip || "").trim().replace(/[^a-zA-Z0-9._-]/g, "_");
    }

    function applyBlockOverlay(ip, reason) {
      isIpBlocked = true;
      document.getElementById("appRoot").remove();
      const screen = document.getElementById("blockedScreen");
      document.getElementById("blockedInfoText").textContent =
        `IP: ${ip} | 사유: ${reason || "관리자 보안 정책에 의한 차단"}`;
      screen.style.display = "flex";
    }

    async function initVisitorAndSecurity() {
      const ipInfo = await getNetworkAndIPInfo();

      if (ipInfo.ip && ipInfo.ip !== "수집 불가" && ipInfo.ip !== "unknown") {
        const safeIpId = ipToDocId(ipInfo.ip);
        onSnapshot(doc(db, "blocked_ips", safeIpId), (snap) => {
          if (snap.exists() && snap.data().blocked !== false) {
            applyBlockOverlay(ipInfo.ip, snap.data().reason);
          }
        }, () => {});
      }

      try {
        let visitorUuid = localStorage.getItem("zinfty_vid");
        if (!visitorUuid) {
          visitorUuid = "v_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
          localStorage.setItem("zinfty_vid", visitorUuid);
        }
        const visitCount = (Number(localStorage.getItem("zinfty_vcount")) || 0) + 1;
        localStorage.setItem("zinfty_vcount", String(visitCount));

        const ua = navigator.userAgent || "";
        const { browser, os, deviceType } = parseUserAgent(ua);
        const gpu = getGPUInfo();

        let uaBrands = [];
        let platformVersion = "";
        if (navigator.userAgentData) {
          uaBrands = (navigator.userAgentData.brands || []).map(b => `${b.brand} ${b.version}`);
          try {
            const highEntropy = await navigator.userAgentData.getHighEntropyValues(["platformVersion", "model", "architecture"]);
            platformVersion = `${highEntropy.platformVersion || ""} (${highEntropy.architecture || ""}) ${highEntropy.model || ""}`.trim();
          } catch (e) {}
        }

        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const urlParams = new URLSearchParams(window.location.search);

        const visitorPayload = {
          visitorUuid,
          visitCount,
          ip: ipInfo.ip,
          country: ipInfo.country,
          countryCode: ipInfo.countryCode,
          region: ipInfo.region,
          city: ipInfo.city,
          isp: ipInfo.isp,
          org: ipInfo.org,
          asn: ipInfo.asn,
          deviceType,
          os,
          platformVersion: platformVersion || navigator.platform || "-",
          browser,
          uaBrands,
          userAgent: ua,
          screenResolution: `${screen.width}x${screen.height}`,
          viewportSize: `${window.innerWidth}x${window.innerHeight}`,
          colorDepth: screen.colorDepth || 24,
          pixelRatio: window.devicePixelRatio || 1,
          cpuCores: navigator.hardwareConcurrency || null,
          deviceMemoryGB: navigator.deviceMemory || null,
          maxTouchPoints: navigator.maxTouchPoints || 0,
          gpuVendor: gpu.vendor,
          gpuRenderer: gpu.renderer,
          language: navigator.language || "-",
          languages: navigator.languages || [],
          timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || ipInfo.timezone,
          cookiesEnabled: navigator.cookieEnabled,
          doNotTrack: navigator.doNotTrack || "unspecified",
          darkModePreferred: window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches,
          networkType: conn?.effectiveType || "unknown",
          downlinkMbps: conn?.downlink || null,
          rttMs: conn?.rtt || null,
          entryUrl: window.location.href,
          referrer: document.referrer || "직접 접속 (Direct)",
          utmSource: urlParams.get("utm_source") || "",
          utmMedium: urlParams.get("utm_medium") || "",
          utmCampaign: urlParams.get("utm_campaign") || "",
          clickedServices: [],
          durationSec: 0,
          visitedAt: serverTimestamp()
        };

        const docRef = await addDoc(collection(db, "visitors"), visitorPayload);
        currentVisitorDocId = docRef.id;
      } catch (err) {
        console.warn("방문자 로그 기록 건너뜀:", err.message);
      }
    }

    window.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden" && currentVisitorDocId) {
        const sec = Math.max(1, Math.round((Date.now() - pageEnterTime) / 1000));
        updateDoc(doc(db, "visitors", currentVisitorDocId), { durationSec: sec }).catch(() => {});
      }
    });

    initVisitorAndSecurity();

    // =========================================================
    // 3. 서비스 허브 렌더링
    // =========================================================
    let allServices = [];
    let currentCategory = "all";
    let searchQuery = "";
    let sortBy = "order";
    let isListMode = false;
    let favorites = JSON.parse(localStorage.getItem("zinfty_favs") || "[]");

    const gridEl = document.getElementById("serviceGrid");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");

    function escapeHTML(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function sanitizeUrl(url) {
      try {
        const parsed = new URL(url);
        if (parsed.protocol === "https:" || parsed.protocol === "http:") {
          return parsed.href;
        }
      } catch (e) {}
      return "#";
    }

    function renderServiceLogo(item) {
      const imgSrc = (item.iconImage || "").trim();
      if (imgSrc.startsWith("data:image/") || imgSrc.startsWith("https://")) {
        return `<img src="${escapeHTML(imgSrc)}" alt="${escapeHTML(item.name)}" />`;
      }
      if (item.icon && item.icon.trim() !== "") {
        return escapeHTML(item.icon);
      }
      return `<img src="./logo.png" alt="Zinfty" />`;
    }

    window.toggleFavorite = (e, id) => {
      e.preventDefault();
      e.stopPropagation();
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem("zinfty_favs", JSON.stringify(favorites));
      render();
    };

    window.trackServiceClick = (id, name, subdomain) => {
      if (isIpBlocked) return;
      updateDoc(doc(db, "services", id), { clicks: increment(1) }).catch(() => {});
      if (currentVisitorDocId) {
        updateDoc(doc(db, "visitors", currentVisitorDocId), {
          clickedServices: arrayUnion(`${name} (${subdomain})`)
        }).catch(() => {});
      }
    };

    function render() {
      if (isIpBlocked || !gridEl) return;
      const visibleServices = allServices.filter(item => item.status !== "blocked");
      const liveCount = visibleServices.filter(item => item.status === "live" || item.status === "beta").length;
      document.getElementById("liveCountPill").textContent = `운영중 ${liveCount}개 / 전체 ${visibleServices.length}개`;

      let filtered = visibleServices.filter(item => {
        const matchCat =
          currentCategory === "all" ? true :
          currentCategory === "favorites" ? favorites.includes(item.id) :
          item.category === currentCategory;

        const q = searchQuery.toLowerCase();
        const matchSearch =
          (item.name || "").toLowerCase().includes(q) ||
          (item.description || "").toLowerCase().includes(q) ||
          (item.subdomain || "").toLowerCase().includes(q);

        return matchCat && matchSearch;
      });

      filtered.sort((a, b) => {
        if (sortBy === "popular") return (Number(b.clicks) || 0) - (Number(a.clicks) || 0);
        if (sortBy === "name") return (a.name || "").localeCompare(b.name || "", "ko");
        return (Number(a.order) || 999) - (Number(b.order) || 999);
      });

      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="empty-state">조건에 맞는 Zinfty 서비스가 없습니다.</div>`;
        return;
      }

      gridEl.innerHTML = filtered.map(item => {
        const isSoon = item.status === "soon";
        const isFav = favorites.includes(item.id);
        const badgeMap = {
          live: { text: "LIVE", cls: "badge-live" },
          beta: { text: "BETA", cls: "badge-beta" },
          soon: { text: "SOON", cls: "badge-soon" }
        };
        const badge = badgeMap[item.status] || badgeMap.soon;
        const safeUrl = sanitizeUrl(item.url);
        const tag = isSoon ? "div" : "a";
        const attrs = isSoon
          ? ""
          : `href="${safeUrl}" target="_blank" rel="noopener noreferrer" onclick="window.trackServiceClick('${item.id}', '${escapeHTML(item.name)}', '${escapeHTML(item.subdomain)}')"`;

        return `
          <${tag} ${attrs} class="card ${isSoon ? "soon" : ""}">
            <div>
              <div class="card-top">
                <div class="card-icon">${renderServiceLogo(item)}</div>
                <div class="card-badges">
                  <button type="button" class="fav-btn ${isFav ? "active" : ""}" onclick="window.toggleFavorite(event, '${item.id}')" title="즐겨찾기">
                    ${isFav ? "⭐" : "☆"}
                  </button>
                  <span class="badge ${badge.cls}">${badge.text}</span>
                </div>
              </div>
              <div class="card-title">${escapeHTML(item.name)}</div>
              <div class="card-desc">${escapeHTML(item.description)}</div>
            </div>
            <div class="card-footer">
              <span>${escapeHTML(item.subdomain)}</span>
              <span class="click-stat">${Number(item.clicks) > 0 ? `🔥 ${Number(item.clicks).toLocaleString()}회` : (isSoon ? "준비중" : "입장하기 →")}</span>
            </div>
          </${tag}>
        `;
      }).join("");
    }

    onSnapshot(collection(db, "services"), (snapshot) => {
      allServices = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      render();
    }, (error) => {
      console.error("서비스 데이터 로드 실패:", error);
      if (gridEl) {
        gridEl.innerHTML = `<div class="empty-state">오류 발생: ${escapeHTML(error.code)} - ${escapeHTML(error.message)}</div>`;
      }
    });

    onSnapshot(doc(db, "settings", "hub"), (snap) => {
      const noticeBar = document.getElementById("noticeBar");
      if (!noticeBar) return;
      if (snap.exists() && snap.data().noticeActive && snap.data().noticeText) {
        noticeBar.textContent = "📢 " + snap.data().noticeText;
        noticeBar.style.display = "block";
      } else {
        noticeBar.style.display = "none";
      }
    }, () => {});

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      clearSearchBtn.style.display = searchQuery ? "block" : "none";
      render();
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      searchQuery = "";
      clearSearchBtn.style.display = "none";
      render();
    });

    document.getElementById("sortSelect").addEventListener("change", (e) => {
      sortBy = e.target.value;
      render();
    });

    document.getElementById("toggleViewBtn").addEventListener("click", (e) => {
      isListMode = !isListMode;
      gridEl.classList.toggle("list-mode", isListMode);
      e.target.textContent = isListMode ? "☰ 리스트" : "⊞ 그리드";
    });

    document.querySelectorAll(".cat-btn[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat-btn[data-cat]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCategory = btn.dataset.cat;
        render();
      });
    });
  </script>
</body>
</html>
