<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zinfty Admin — admin.zinfty.com</title>
  <style>
    :root {
      --bg-page: #f0f9ff;
      --bg-white: #ffffff;
      --sky-primary: #0ea5e9;
      --sky-dark: #0284c7;
      --sky-soft: #e0f2fe;
      --border: #bae6fd;
      --border-gray: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #475569;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 100%);
    }

    .auth-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(14, 165, 233, 0.12);
    }

    .auth-logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .auth-card h1 { font-size: 1.5rem; margin-bottom: 8px; }
    .auth-card p { color: var(--text-sub); font-size: 0.92rem; margin-bottom: 28px; }

    .google-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .google-btn:hover {
      background: var(--sky-soft);
      border-color: var(--sky-primary);
    }

    .error-box {
      margin-top: 20px;
      padding: 14px;
      border-radius: 12px;
      background: var(--danger-soft);
      color: #b91c1c;
      font-size: 0.85rem;
      font-weight: 600;
      display: none;
    }

    #adminDashboard { display: none; }

    header {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 68px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.2rem;
    }

    .brand span.tag {
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--sky-soft);
      color: var(--sky-dark);
      font-family: monospace;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--sky-primary);
      color: #ffffff;
    }
    .btn-primary:hover { background: var(--sky-dark); }

    .btn-outline {
      background: #ffffff;
      border-color: var(--border-gray);
      color: var(--text-sub);
    }
    .btn-outline:hover { border-color: var(--sky-primary); color: var(--sky-dark); }

    .btn-danger {
      background: var(--danger-soft);
      color: #b91c1c;
    }
    .btn-danger:hover { background: #fecaca; }

    .btn-sm { padding: 6px 11px; font-size: 0.78rem; border-radius: 8px; }

    .main-wrap {
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 24px 80px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 12px 22px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text-sub);
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--sky-primary);
      color: #ffffff;
      border-color: var(--sky-primary);
    }

    .panel {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(14, 165, 233, 0.06);
      margin-bottom: 24px;
    }

    .panel h2 {
      font-size: 1.15rem;
      margin-bottom: 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-gray);
      font-size: 0.9rem;
      outline: none;
    }

    .field input:focus, .field select:focus {
      border-color: var(--sky-primary);
      box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #f1f5f9;
    }

    th {
      color: var(--text-sub);
      font-weight: 700;
      background: #f8fafc;
    }

    .status-tag {
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
    }
    .st-live { background: #dcfce7; color: #15803d; }
    .st-beta { background: #e0f2fe; color: #0369a1; }
    .st-soon { background: #f1f5f9; color: #475569; }
    .st-blocked { background: #fee2e2; color: #b91c1c; }

    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  </style>
</head>
<body>

  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">∞</div>
      <h1>Zinfty Admin</h1>
      <p>인가된 화이트리스트 구글 계정만 접근할 수 있는<br>최고 보안 관리자 콘솔입니다.</p>
      <button id="loginBtn" class="google-btn">
        <span>🔐</span> Google 계정으로 보안 로그인
      </button>
      <div id="authError" class="error-box"></div>
    </div>
  </div>

  <div id="adminDashboard">
    <header>
      <div class="header-inner">
        <div class="brand">
          <span>Zinfty Control Center</span>
          <span class="tag">admin.zinfty.com</span>
        </div>
        <div class="user-area">
          <span id="adminEmailLabel" style="font-weight:600; color:var(--sky-dark);"></span>
          <a href="https://zinfty.com" target="_blank" class="btn btn-outline btn-sm">허브 보기 ↗</a>
          <button id="logoutBtn" class="btn btn-danger btn-sm">로그아웃</button>
        </div>
      </div>
    </header>

    <div class="main-wrap">
      <div class="tabs">
        <button class="tab-btn active" data-tab="servicesTab">🌐 서브도메인 서비스 관리</button>
        <button class="tab-btn" data-tab="whitelistTab">🛡️ 관리자 화이트리스트 & 차단</button>
      </div>

      <div id="servicesTab">
        <div class="panel">
          <h2>
            <span id="formTitle">새 서브도메인 서비스 등록</span>
            <button id="cancelEditBtn" class="btn btn-outline btn-sm" style="display:none;">수정 취소</button>
          </h2>
          <form id="serviceForm">
            <input type="hidden" id="editServiceId" />
            <div class="form-grid">
              <div class="field">
                <label>서비스 이름 *</label>
                <input type="text" id="svcName" placeholder="예: Zinfty Game" maxlength="50" required />
              </div>
              <div class="field">
                <label>서브도메인 표기 *</label>
                <input type="text" id="svcSubdomain" placeholder="예: game.zinfty.com" maxlength="100" required />
              </div>
              <div class="field">
                <label>연결 URL (https:// 필수) *</label>
                <input type="url" id="svcUrl" placeholder="https://game.zinfty.com" maxlength="300" required />
              </div>
              <div class="field">
                <label>아이콘 (이모지)</label>
                <input type="text" id="svcIcon" placeholder="🎮" value="🚀" maxlength="4" />
              </div>
              <div class="field">
                <label>카테고리</label>
                <select id="svcCategory">
                  <option value="social">소셜 & 채팅 (social)</option>
                  <option value="entertainment">게임 & 엔터 (entertainment)</option>
                  <option value="tools">유틸리티 & AI (tools)</option>
                </select>
              </div>
              <div class="field">
                <label>상태 및 노출 제어</label>
                <select id="svcStatus">
                  <option value="live">LIVE (정상 운영)</option>
                  <option value="beta">BETA (베타 운영)</option>
                  <option value="soon">SOON (준비중 - 클릭 불가)</option>
                  <option value="blocked">BLOCKED (차단 - 허브에서 완전 숨김)</option>
                </select>
              </div>
              <div class="field">
                <label>정렬 순서 (낮을수록 앞)</label>
                <input type="number" id="svcOrder" value="10" />
              </div>
            </div>
            <div class="field" style="margin-bottom:16px;">
              <label>서비스 설명 *</label>
              <input type="text" id="svcDesc" placeholder="서비스에 대한 간단한 설명을 입력하세요." maxlength="200" required />
            </div>
            <button type="submit" class="btn btn-primary" id="saveSvcBtn">서버에 안전하게 저장</button>
          </form>
        </div>

        <div class="panel">
          <h2>등록된 전체 서비스 목록</h2>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>순서</th>
                  <th>서비스</th>
                  <th>서브도메인 / 링크</th>
                  <th>카테고리</th>
                  <th>상태</th>
                  <th>제어 (수정 / 차단 / 삭제)</th>
                </tr>
              </thead>
              <tbody id="servicesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="whitelistTab" style="display:none;">
        <div class="panel">
          <h2>화이트리스트 구글 계정 추가</h2>
          <form id="whitelistForm" style="display:flex; gap:12px; flex-wrap:wrap;">
            <input type="email" id="newAdminEmail" placeholder="허용할 구글 이메일 (example@gmail.com)" required
              style="flex:1; min-width:240px; padding:11px 14px; border-radius:10px; border:1px solid var(--border-gray);" />
            <input type="text" id="newAdminMemo" placeholder="메모 (예: 공동 관리자)"
              style="width:200px; padding:11px 14px; border-radius:10px; border:1px solid var(--border-gray);" />
            <button type="submit" class="btn btn-primary">화이트리스트 등록</button>
          </form>
        </div>

        <div class="panel">
          <h2>화이트리스트 관리자 목록 및 권한 제어</h2>
          <div style="overflow-x:auto;">
            <table>
              <thead>
                <tr>
                  <th>구글 이메일</th>
                  <th>메모</th>
                  <th>권한 상태</th>
                  <th>관리 (차단 토글 / 삭제)</th>
                </tr>
              </thead>
              <tbody id="whitelistTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
      onSnapshot, query, orderBy, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyACPThFj93lZ__x6OjIsNQaifL9LAEleGw",
      authDomain: "zinfty.firebaseapp.com",
      projectId: "zinfty",
      storageBucket: "zinfty.firebasestorage.app",
      messagingSenderId: "858644844927",
      appId: "1:858644844927:web:43427e13c7c01a8f288a4a",
      measurementId: "G-04QXTF2YYQ"
    };

    const MASTER_EMAIL = "leemyungsu486@gmail.com";

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    let currentUserEmail = null;
    let unsubServices = null;
    let unsubAdmins = null;

    const authScreen = document.getElementById("authScreen");
    const adminDashboard = document.getElementById("adminDashboard");
    const authError = document.getElementById("authError");

    function showAuthError(msg) {
      authError.textContent = msg;
      authError.style.display = "block";
    }

    function escapeHTML(str) {
      if (!str) return "";
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      authError.style.display = "none";
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        showAuthError("로그인 오류: " + err.message);
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        currentUserEmail = null;
        if (unsubServices) unsubServices();
        if (unsubAdmins) unsubAdmins();
        adminDashboard.style.display = "none";
        authScreen.style.display = "flex";
        return;
      }

      try {
        const adminRef = doc(db, "admins", user.email);
        const adminSnap = await getDoc(adminRef);

        if (!adminSnap.exists()) {
          await setDoc(adminRef, {
            email: user.email,
            memo: user.email === MASTER_EMAIL ? "Master Admin" : "Whitelisted Admin",
            active: true,
            createdAt: serverTimestamp()
          });
        } else if (adminSnap.data().active === false && user.email !== MASTER_EMAIL) {
          throw new Error("차단된 관리자 계정입니다.");
        }

        currentUserEmail = user.email;
        document.getElementById("adminEmailLabel").textContent = user.email;
        authScreen.style.display = "none";
        adminDashboard.style.display = "block";
        startRealtimeListeners();

      } catch (err) {
        await signOut(auth);
        showAuthError(`접근 거부 (${user.email}): 화이트리스트에 등록되지 않았거나 차단된 계정입니다.`);
      }
    });

    function startRealtimeListeners() {
      const svcQuery = query(collection(db, "services"), orderBy("order", "asc"));
      unsubServices = onSnapshot(svcQuery, (snap) => {
        const tbody = document.getElementById("servicesTableBody");
        tbody.innerHTML = snap.docs.map(d => {
          const s = d.data();
          const stClass = `st-${s.status || "soon"}`;
          return `
            <tr>
              <td>${Number(s.order) || 0}</td>
              <td><strong>${escapeHTML(s.icon)} ${escapeHTML(s.name)}</strong><br><small style="color:#64748b;">${escapeHTML(s.description)}</small></td>
              <td><code>${escapeHTML(s.subdomain)}</code><br><a href="${escapeHTML(s.url)}" target="_blank" style="font-size:0.78rem;color:#0284c7;">${escapeHTML(s.url)}</a></td>
              <td>${escapeHTML(s.category)}</td>
              <td><span class="status-tag ${stClass}">${escapeHTML((s.status || "").toUpperCase())}</span></td>
              <td>
                <div class="actions">
                  <button class="btn btn-outline btn-sm" onclick="window.editService('${d.id}')">수정</button>
                  <button class="btn btn-outline btn-sm" onclick="window.toggleBlockService('${d.id}', '${s.status}')">
                    ${s.status === "blocked" ? "차단해제" : "차단"}
                  </button>
                  <button class="btn btn-danger btn-sm" onclick="window.deleteService('${d.id}')">삭제</button>
                </div>
              </td>
            </tr>
          `;
        }).join("");
      });

      unsubAdmins = onSnapshot(collection(db, "admins"), (snap) => {
        const tbody = document.getElementById("whitelistTableBody");
        tbody.innerHTML = snap.docs.map(d => {
          const a = d.data();
          const email = d.id;
          const isProtected = email === currentUserEmail || email === MASTER_EMAIL;
          return `
            <tr>
              <td><strong>${escapeHTML(email)}</strong> ${email === MASTER_EMAIL ? "<small style='color:#0284c7;'>(마스터)</small>" : ""}</td>
              <td>${escapeHTML(a.memo || "-")}</td>
              <td><span class="status-tag ${a.active ? "st-live" : "st-blocked"}">${a.active ? "ACTIVE" : "BLOCKED"}</span></td>
              <td>
                <div class="actions">
                  ${isProtected ? "<small style='color:#94a3b8;'>최고 권한 보호됨</small>" : `
                    <button class="btn btn-outline btn-sm" onclick="window.toggleAdminActive('${escapeHTML(email)}', ${!!a.active})">
                      ${a.active ? "권한 차단" : "차단 해제"}
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="window.removeAdmin('${escapeHTML(email)}')">삭제</button>
                  `}
                </div>
              </td>
            </tr>
          `;
        }).join("");
      });
    }

    const serviceForm = document.getElementById("serviceForm");
    serviceForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const editId = document.getElementById("editServiceId").value;
      const payload = {
        name: document.getElementById("svcName").value.trim(),
        subdomain: document.getElementById("svcSubdomain").value.trim(),
        url: document.getElementById("svcUrl").value.trim(),
        icon: document.getElementById("svcIcon").value.trim() || "🚀",
        category: document.getElementById("svcCategory").value,
        status: document.getElementById("svcStatus").value,
        order: Number(document.getElementById("svcOrder").value) || 10,
        description: document.getElementById("svcDesc").value.trim(),
        updatedAt: serverTimestamp(),
        updatedBy: currentUserEmail
      };

      try {
        if (editId) {
          await updateDoc(doc(db, "services", editId), payload);
        } else {
          payload.createdAt = serverTimestamp();
          await addDoc(collection(db, "services"), payload);
        }
        resetServiceForm();
      } catch (err) {
        alert("서버 저장 거부됨 (보안 규칙 위반): " + err.message);
      }
    });

    function resetServiceForm() {
      serviceForm.reset();
      document.getElementById("editServiceId").value = "";
      document.getElementById("formTitle").textContent = "새 서브도메인 서비스 등록";
      document.getElementById("cancelEditBtn").style.display = "none";
    }
    document.getElementById("cancelEditBtn").addEventListener("click", resetServiceForm);

    window.editService = async (id) => {
      const snap = await getDoc(doc(db, "services", id));
      if (!snap.exists()) return;
      const s = snap.data();
      document.getElementById("editServiceId").value = id;
      document.getElementById("svcName").value = s.name;
      document.getElementById("svcSubdomain").value = s.subdomain;
      document.getElementById("svcUrl").value = s.url;
      document.getElementById("svcIcon").value = s.icon;
      document.getElementById("svcCategory").value = s.category;
      document.getElementById("svcStatus").value = s.status;
      document.getElementById("svcOrder").value = s.order;
      document.getElementById("svcDesc").value = s.description;
      document.getElementById("formTitle").textContent = "서비스 정보 수정 중";
      document.getElementById("cancelEditBtn").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    };

    window.toggleBlockService = async (id, currentStatus) => {
      const nextStatus = currentStatus === "blocked" ? "live" : "blocked";
      try {
        await updateDoc(doc(db, "services", id), { status: nextStatus, updatedAt: serverTimestamp() });
      } catch (err) {
        alert("권한 오류: " + err.message);
      }
    };

    window.deleteService = async (id) => {
      if (!confirm("정말 이 서비스를 영구 삭제하시겠습니까?")) return;
      try {
        await deleteDoc(doc(db, "services", id));
      } catch (err) {
        alert("권한 오류: " + err.message);
      }
    };

    document.getElementById("whitelistForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("newAdminEmail").value.trim().toLowerCase();
      const memo = document.getElementById("newAdminMemo").value.trim();
      try {
        await setDoc(doc(db, "admins", email), {
          email,
          memo,
          active: true,
          addedBy: currentUserEmail,
          createdAt: serverTimestamp()
        });
        e.target.reset();
      } catch (err) {
        alert("화이트리스트 등록 거부됨: " + err.message);
      }
    });

    window.toggleAdminActive = async (email, currentActive) => {
      if (email === MASTER_EMAIL) return;
      try {
        await updateDoc(doc(db, "admins", email), { active: !currentActive });
      } catch (err) {
        alert("권한 오류: " + err.message);
      }
    };

    window.removeAdmin = async (email) => {
      if (email === MASTER_EMAIL) return;
      if (!confirm(`${email} 계정을 화이트리스트에서 완전히 삭제하시겠습니까?`)) return;
      try {
        await deleteDoc(doc(db, "admins", email));
      } catch (err) {
        alert("권한 오류: " + err.message);
      }
    };

    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("servicesTab").style.display = btn.dataset.tab === "servicesTab" ? "block" : "none";
        document.getElementById("whitelistTab").style.display = btn.dataset.tab === "whitelistTab" ? "block" : "none";
      });
    });
  </script>
</body>
</html>
